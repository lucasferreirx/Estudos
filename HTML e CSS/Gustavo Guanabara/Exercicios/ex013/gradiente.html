<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradientes em CSS</title>
    <style>
        * {
            height: 100%;
        }
        body {
            background-image: linear-gradient(to bottom, #35424F, #FFB800, #FE9A00, #FE8510);
            
        }
        h1 {
            color: white;
        }
    </style>
</head>
<body>
    <h1>Teste de gradientes</h1>
</body>
</html>
